name: Momentum CI & Hardened Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Lint, Test, Audit & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Frontend Unit & Storage Leak Audit Tests
        working-directory: ./frontend
        run: npm test

      - name: Run Backend API & Security Tests
        working-directory: ./backend
        run: npm test

      - name: Security Vulnerability Audit (Frontend)
        working-directory: ./frontend
        run: npm audit

      - name: Security Vulnerability Audit (Backend)
        working-directory: ./backend
        run: npm audit

      - name: Verify Zero-Secret Leakage
        run: |
          # Verify no .env or private key fragments are committed
          if git status --ignored | grep -E '\.env$'; then
            echo "Environment files properly ignored."
          fi

      - name: Build Production Frontend
        working-directory: ./frontend
        run: npm run build
