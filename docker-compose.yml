version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: momentum-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: momentum
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: momentum-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://root:rootpassword@mongodb:27017/momentum?authSource=admin
      CORS_ORIGIN: http://localhost:3000
      COOKIE_SECRET: local_docker_cookie_secret_at_least_32_chars_long
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-project}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-demo-admin@demo-project.iam.gserviceaccount.com}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:----BEGIN PRIVATE KEY-----\nMIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQC...\n-----END PRIVATE KEY-----\n}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-demo-gemini-key}
    depends_on:
      - mongodb

volumes:
  mongo_data:
    driver: local
