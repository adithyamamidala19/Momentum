<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Momentum — Login</title>
<!-- Google Fonts: Plus Jakarta Sans & Newsreader -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            teal: {
              DEFAULT: '#0F6E56',
              light: '#E1F5EE',
              hover: '#0c5845'
            },
            amber: {
              DEFAULT: '#BA7517',
              light: '#FAEEDA'
            },
            bg: '#FBFBFA',
            surface: '#FFFFFF',
            charcoal: '#1E2322',
            muted: '#68726F',
            borderHairline: '#E7E9E8'
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            editorial: ['"Newsreader"', 'Georgia', 'serif']
          }
        }
      }
    }
  </script>
<style>
    body {
      background-color: #FBFBFA;
      color: #1E2322;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .editorial {
      font-family: 'Newsreader', Georgia, serif;
    }
    .hairline-border {
      border: 0.5px solid #E5E7E6;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-[390px] mx-auto px-6 py-8 relative selection:bg-teal-light selection:text-teal">
<!-- Top bar / Safe area spacing -->
<div class="w-full flex items-center justify-between pt-2">
<!-- Optional small subtle wordmark / neutral anchor -->
<div class="flex items-center gap-1.5 opacity-60">
<span class="text-xs tracking-wider uppercase font-medium text-muted">Momentum</span>
</div>
<div class="text-xs text-muted">
<!-- Quiet subtle indicator -->
</div>
</div>
<!-- Main Centered Content Container -->
<main class="w-full my-auto flex flex-col items-center text-center">
<!-- Leaf icon mark inside soft teal-tinted circle -->
<div class="w-14 h-14 rounded-full bg-teal-light flex items-center justify-center mb-7">
<svg class="w-6 h-6 text-teal stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" viewbox="0 0 24 24">
<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path>
<path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path>
</svg>
</div>
<!-- Editorial Warm Headline -->
<h1 class="editorial text-3xl sm:text-4xl text-charcoal font-normal tracking-tight mb-2.5">Save your rhythm</h1>
<!-- Muted Subtext -->
<p class="text-[15px] leading-relaxed text-muted max-w-[320px] font-normal mb-7">So it's never lost, even if you switch devices.</p>
<!-- Login Form -->
<form class="w-full space-y-4" onsubmit="event.preventDefault();"><!-- Social Sign-in Options (Apple & Google) -->
<div class="space-y-2.5 w-full">
<!-- Continue with Apple -->
<button class="w-full py-3.5 px-4 rounded-xl bg-transparent hairline-border hover:bg-white/60 active:bg-white text-charcoal text-[14px] font-medium transition duration-150 flex items-center justify-center gap-2.5" type="button">
<svg class="w-4 h-4 text-charcoal" fill="currentColor" viewbox="0 0 24 24">
<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.75 1.04-1.8 0.92-2.87-.93.04-2.02.63-2.66 1.38-.56.65-1.05 1.71-.91 2.74 1.04.08 2.06-.55 2.65-1.25z"></path>
</svg>
<span>Continue with Apple</span>
</button>
<!-- Continue with Google -->
<button class="w-full py-3.5 px-4 rounded-xl bg-transparent hairline-border hover:bg-white/60 active:bg-white text-charcoal text-[14px] font-medium transition duration-150 flex items-center justify-center gap-2.5" type="button">
<svg class="w-4 h-4" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.15z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.25 21.36 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.16 0 9.98 0 12c0 2.02.46 3.84 1.26 5.42l4.02-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.25 2.64 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span>Continue with Google</span>
</button>
</div>
<!-- Divider / Quiet separation -->
<div class="py-1.5 flex items-center gap-3">
<div class="flex-1 h-[0.5px] bg-[#E8EAE9]"></div>
<span class="text-xs text-muted/70 font-normal">or</span>
<div class="flex-1 h-[0.5px] bg-[#E8EAE9]"></div>
</div>
<!-- Form Input Fields -->
<div class="space-y-2.5 w-full text-left">
<div>
<label class="sr-only" for="name">Full name</label>
<input class="w-full px-4 py-3 rounded-xl bg-surface hairline-border text-[15px] text-charcoal placeholder:text-muted/60 focus:outline-none focus:ring-1 focus:ring-teal focus:border-teal transition-all duration-150" id="name" name="name" placeholder="Full name" type="text"/>
</div>
<div>
<label class="sr-only" for="email">Email or phone</label>
<input class="w-full px-4 py-3 rounded-xl bg-surface hairline-border text-[15px] text-charcoal placeholder:text-muted/60 focus:outline-none focus:ring-1 focus:ring-teal focus:border-teal transition-all duration-150" id="email" name="email" placeholder="Email or phone" type="text"/>
</div>
<div>
<label class="sr-only" for="password">Create a password</label>
<input class="w-full px-4 py-3 rounded-xl bg-surface hairline-border text-[15px] text-charcoal placeholder:text-muted/60 focus:outline-none focus:ring-1 focus:ring-teal focus:border-teal transition-all duration-150" id="password" name="password" placeholder="Create a password" type="password"/>
</div>
</div>
<!-- Primary Action: Create account -->
<div class="pt-1 space-y-3">
<button class="w-full py-3.5 px-5 rounded-xl bg-teal hover:bg-teal-hover active:scale-[0.99] text-white text-[15px] font-medium transition duration-150 flex items-center justify-center shadow-sm" type="button">
          Create account
        </button>
<!-- Plain-text 'Not now' skip option -->
<button class="w-full py-2 text-center text-sm font-normal text-muted hover:text-charcoal transition-colors duration-150" type="button">
          Not now
        </button>
</div></form>
</main>
<!-- Quiet, unhurried footer link -->
<footer class="w-full pt-6 pb-2 text-center"><p class="text-xs text-muted/80 max-w-[280px] mx-auto leading-relaxed">
      Your practice is safely stored on this device until you connect an account.
    </p></footer>
</body>
</html>
