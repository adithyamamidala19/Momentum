ne-sm text-primary tracking-normal font-medium">momentum</span></div></header><main class="flex-1 w-full max-w-[720px] mx-auto px-margin md:px-gutter-desktop flex flex-col justify-center py-space-xl"><div class="flex flex-col w-full max-w-xl mx-auto py-space-sm">

<span>Back</span>
</a>

<span>Next</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>

<script>
  (function() {
    const options = document.querySelectorAll('.ritual-option');
    
    function setSelection(selectedElement) {
      options.forEach(option => {
        const isSelected = (option === selectedElement);
        option.setAttribute('aria-checked', isSelected ? 'true' : 'false');
        
        const iconContainer = option.querySelector('.w-10');
        const textElement = option.querySelector('.font-body-lg');
        const indicator = option.querySelector('.indicator');
        const dot = option.querySelector('.dot');
        
        if (isSelected) {
          option.classList.remove('bg-surface-container-lowest', 'hover:bg-surface-container-low');
          option.classList.add('bg-primary-fixed/20');
          
          iconContainer.classList.remove('bg-surface-container-low', 'text-tertiary');
          iconContainer.classList.add('bg-primary-container', 'text-on-primary');
          
          textElement.classList.add('font-medium');
          
          indicator.classList.remove('bg-surface-container-low');
          indicator.classList.add('bg-primary-container');
          
          dot.classList.remove('bg-transparent');
          dot.classList.add('bg-surface-container-lowest');
        } else {
          option.classList.add('bg-surface-container-lowest', 'hover:bg-surface-container-low');
          option.classList.remove('bg-primary-fixed/20');
          
          iconContainer.classList.add('bg-surface-container-low', 'text-tertiary');
          iconContainer.classList.remove('bg-primary-container', 'text-on-primary');
          
          textElement.classList.remove('font-medium');
          
          indicator.classList.add('bg-surface-container-low');
          indicator.classList.remove('bg-primary-container');
          
          dot.classList.add('bg-transparent');
          dot.classList.remove('bg-surface-container-lowest');
        }
      });
    }

    options.forEach(option => {
      option.addEventListener('click', () => setSelection(option));
      option.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          setSelection(option);
        }
      });
    });
  })();
</script></main><footer class="w-full py-space-lg text-center bg-transparent"><p class="font-label-sm text-label-sm text-outline">a gentle space for daily practice</p></footer></body></html>
