<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Momentum — Pick a Focus &amp; First Ritual</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            teal: {
              primary: '#0F6E56',
              light: '#E1F5EE',
              hover: '#0B5945',
              tint: '#F0F9F5',
            },
            amber: {
              accent: '#BA7517',
              tint: '#FAEEDA',
            },
            charcoal: '#1C201E',
            muted: '#636D67',
            lightgray: '#E6EAE8',
            surface: '#FBFBFA',
            card: '#FFFFFF',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            serif: ['Newsreader', 'Georgia', 'serif'],
          },
          boxShadow: {
            subtle: '0 2px 10px rgba(0, 0, 0, 0.02)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #FBFBFA;
      color: #1C201E;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .editorial {
      font-family: 'Newsreader', Georgia, serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6 md:p-10 select-none">

  <!-- Top Navigation / Brand Anchor -->
  <header class="w-full max-w-xl mx-auto flex items-center justify-between pt-2">
    <!-- Back or discreet icon -->
    <a href="#" class="inline-flex items-center text-xs font-medium text-muted hover:text-charcoal transition-colors py-1 px-2.5 rounded-lg hover:bg-black/5 -ml-2">
      <svg class="w-4 h-4 mr-1.5 stroke-[1.75]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
      </svg>
      <span>Back</span>
    </a>

    <!-- Brand mark -->
    <div class="flex items-center space-x-2">
      <span class="w-2 h-2 rounded-full bg-teal-primary/60"></span>
      <span class="text-[11px] uppercase tracking-widest text-muted/80 font-medium">Momentum</span>
    </div>

    <!-- Quiet step counter -->
    <div class="text-xs text-muted font-medium bg-black/[0.03] px-2.5 py-1 rounded-full border border-black/[0.04]">
      Step 1 of 2
    </div>
  </header>

  <!-- Main Focus Container -->
  <main class="w-full max-w-xl mx-auto flex-1 flex flex-col justify-center py-8">
    
    <!-- Headline Section -->
    <div class="text-center mb-8">
      <h1 class="editorial text-3xl sm:text-4xl font-normal text-charcoal tracking-tight mb-2.5">
        What matters to you right now?
      </h1>
      <p class="text-sm sm:text-base text-muted max-w-md mx-auto leading-relaxed">
        Pick one to start. You can add more later.
      </p>
    </div>

    <!-- 2x2 Category Grid -->
    <div class="grid grid-cols-2 gap-3.5 mb-6">
      
      <!-- Category 1: Health (Selected State) -->
      <button type="button" class="group relative flex flex-col items-start p-4 sm:p-5 rounded-2xl bg-teal-light/50 border border-teal-primary/80 transition-all duration-200 text-left focus:outline-none">
        <div class="w-10 h-10 rounded-xl bg-teal-light flex items-center justify-center text-teal-primary mb-3 transition-transform group-hover:scale-[1.02]">
          <!-- Outline Heart / Vitality icon -->
          <svg class="w-5 h-5 stroke-[1.75]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
          </svg>
        </div>
        <div class="flex items-center justify-between w-full">
          <span class="text-sm sm:text-base font-medium text-charcoal">Health</span>
          <!-- Discreet indicator dot for selected -->
          <span class="w-2 h-2 rounded-full bg-teal-primary"></span>
        </div>
        <span class="text-[12px] text-muted mt-0.5">Energy, rest &amp; nourishment</span>
      </button>

      <!-- Category 2: Mind (Unselected State) -->
      <button type="button" class="group relative flex flex-col items-start p-4 sm:p-5 rounded-2xl bg-white border border-black/[0.08] hover:border-black/[0.15] transition-all duration-200 text-left focus:outline-none">
        <div class="w-10 h-10 rounded-xl bg-surface flex items-center justify-center text-muted group-hover:text-charcoal mb-3 transition-colors">
          <!-- Outline Wind / Presence / Mind icon -->
          <svg class="w-5 h-5 stroke-[1.75]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
          </svg>
        </div>
        <div class="flex items-center justify-between w-full">
          <span class="text-sm sm:text-base font-medium text-charcoal">Mind</span>
        </div>
        <span class="text-[12px] text-muted mt-0.5">Stillness, breath &amp; reflection</span>
      </button>

      <!-- Category 3: Focus (Unselected State) -->
      <button type="button" class="group relative flex flex-col items-start p-4 sm:p-5 rounded-2xl bg-white border border-black/[0.08] hover:border-black/[0.15] transition-all duration-200 text-left focus:outline-none">
        <div class="w-10 h-10 rounded-xl bg-surface flex items-center justify-center text-muted group-hover:text-charcoal mb-3 transition-colors">
          <!-- Outline Compass / Target / Focus icon -->
          <svg class="w-5 h-5 stroke-[1.75]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.042 21.672L13.684 16.6m0 0l-2.51 2.225.569-9.47 5.227 7.917-3.286-.672zm-7.518-.267A8.25 8.25 0 1120.25 10.5M8.288 14.212A5.25 5.25 0 1117.25 10.5" />
          </svg>
        </div>
        <div class="flex items-center justify-between w-full">
          <span class="text-sm sm:text-base font-medium text-charcoal">Focus</span>
        </div>
        <span class="text-[12px] text-muted mt-0.5">Deep work &amp; clear thinking</span>
      </button>

      <!-- Category 4: Craft (Unselected State) -->
      <button type="button" class="group relative flex flex-col items-start p-4 sm:p-5 rounded-2xl bg-white border border-black/[0.08] hover:border-black/[0.15] transition-all duration-200 text-left focus:outline-none">
        <div class="w-10 h-10 rounded-xl bg-surface flex items-center justify-center text-muted group-hover:text-charcoal mb-3 transition-colors">
          <!-- Outline Feather / Book / Craft icon -->
          <svg class="w-5 h-5 stroke-[1.75]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
          </svg>
        </div>
        <div class="flex items-center justify-between w-full">
          <span class="text-sm sm:text-base font-medium text-charcoal">Craft</span>
        </div>
        <span class="text-[12px] text-muted mt-0.5">Reading, writing &amp; practice</span>
      </button>

    </div>

    <!-- Suggested Starting Ritual Card (Dynamic match to Health) -->
    <div class="mb-8">
      <div class="flex items-center justify-between px-1 mb-2.5">
        <span class="text-[11px] uppercase tracking-wider text-muted font-medium">Suggested first ritual</span>
        <span class="text-xs text-teal-primary font-medium">Simple &amp; gentle</span>
      </div>

      <div class="p-4 sm:p-5 rounded-2xl bg-white border border-black/[0.07] shadow-subtle flex items-center justify-between gap-4">
        <div class="flex items-center space-x-3.5 min-w-0">
          <!-- Leading outline icon matching ritual -->
          <div class="w-10 h-10 rounded-xl bg-teal-light/70 text-teal-primary flex items-center justify-center shrink-0">
            <!-- Outline glass / hydration icon -->
            <svg class="w-5 h-5 stroke-[1.75]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v13.5m0 0l-3.5-3.5m3.5 3.5l3.5-3.5M6 20.25h12" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 9.75a7.5 7.5 0 01-15 0" />
            </svg>
          </div>
          
          <div class="min-w-0">
            <h3 class="text-sm sm:text-base font-medium text-charcoal truncate">Morning hydration</h3>
            <p class="text-xs sm:text-[13px] text-muted mt-0.5 flex items-center">
              <span class="inline-block w-1.5 h-1.5 rounded-full bg-teal-primary/50 mr-1.5"></span>
              <span>Anchor: right after waking up</span>
            </p>
          </div>
        </div>

        <!-- Quiet circular affordance matching Today screen design language -->
        <div class="w-6 h-6 rounded-full border border-black/20 flex items-center justify-center shrink-0">
          <div class="w-2 h-2 rounded-full bg-black/10"></div>
        </div>
      </div>
    </div>

    <!-- Actions Section -->
    <div class="flex flex-col items-center space-y-3 w-full max-w-md mx-auto">
      <button type="button" class="w-full py-3.5 px-6 rounded-xl bg-teal-primary text-white font-medium text-sm sm:text-base hover:bg-teal-hover transition-colors shadow-sm text-center">
        Start with this ritual
      </button>

      <button type="button" class="text-xs sm:text-sm text-muted hover:text-charcoal transition-colors py-1">
        Choose a different starting point
      </button>
    </div>

  </main>

  <!-- Grounding Editorial Footer -->
  <footer class="w-full max-w-xl mx-auto text-center py-2">
    <p class="editorial italic text-xs sm:text-sm text-muted/80">
      Small actions today become your stronger self tomorrow.
    </p>
  </footer>

</body>
</html>
